name: SIG CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Check raw-data availability
        shell: bash
        run: |
          if [ -f "data/questbench/GSM-Q.csv" ]; then
            echo "Raw datasets found; running full reproduction."
            python run_all.py --from-raw
          else
            echo "Raw datasets are intentionally not distributed in this repository."
            echo "See data/README.md for download instructions."
          fi
